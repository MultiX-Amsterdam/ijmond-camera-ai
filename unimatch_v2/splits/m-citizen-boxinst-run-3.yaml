# arguments for setting up and training a model
configuration: configs/ijmond_dinov3.yaml
smoke_dataset: ""
clear_dataset: ""
unlabeled_dataset: experiment/unlabeled.txt
validation_dataset: experiment/expert_standard_val.txt
test_dataset: experiment/expert_standard_test.txt
val_robust_dataset: experiment/expert_standard_val_corrupt.txt
test_robust_dataset: experiment/expert_standard_test_corrupt.txt
test_model: best.pth
pretrained_model: m-zeroshot
citizen_data: ijmond_bbox/filtered_bbox_labels_1_aug_2025.json
citizen_img: ijmond_bbox/img
citizen_correction: true
awl: true
awl_weight: 1
awl_citizen_batch_ratio: 1.0
boxinst: true
boxinst_weight: 0.125
boxinst_color_thresh: 0.1
boxinst_pairwise_size: 3
boxinst_pairwise_dilation: 2
boxinst_neg_weight: 2.0
fcos_cls: true
fcos_cls_weight: 1
fcos_alpha: 0.25
fcos_gamma: 2.0
fcos_center_sample: true
fcos_radius_ratio: 0.5
epoch_ratio: 1.0
