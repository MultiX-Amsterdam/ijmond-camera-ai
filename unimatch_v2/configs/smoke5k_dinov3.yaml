# arguments for dataset
dataset: smoke5k
data_root: /home/yhsu/ijmond-camera-ai/bbox_learn/dataset
nclass: 2
crop_size: 256 # must be divisible by 16 (DINOv3 patch size)
base_size: 512 # long side rescaled to this before scale jitter (2x crop_size)

# arguments for training
epochs: 200 # use 200 epochs for full training
batch_size: 60 # per GPU (decrease this if using multiple GPUs to avoid OOM)
lr: 0.00001 # use 0.000005 for single GPU, 0.00001 for two GPUs, 0.000015 for three, and 0.00002 for four
lr_multi: 40.0
criterion:
  name: CELoss
  kwargs:
    ignore_index: 255
conf_thresh: 0.95

# Boundary leniency: reduces loss penalty at smoke/background edges
boundary_lenience:
  enabled: False
  alpha: 0.8        # leniency strength in [0, 1]; 0 = standard CE, 1 = full leniency at edges
  window_size: 7    # AvgPool2d kernel size for local density estimation
  band_kernel_size: 7  # morphological dilation/erosion kernel for the eval exclusion band

# arguments for model
model: dpt
backbone: dinov3_small
lock_backbone: True
use_dcp: True