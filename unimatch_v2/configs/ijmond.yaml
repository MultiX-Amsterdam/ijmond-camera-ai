# arguments for dataset
dataset: ijmond
data_root: bbox_learn/dataset/ijmond_pseudo_masks
nclass: 2
crop_size: 518

# arguments for training
epochs: 10
batch_size: 8
lr: 0.000005
lr_multi: 40.0
criterion:
  name: CELoss
  kwargs:
    ignore_index: 255
conf_thresh: 0.95

# arguments for model
model: dpt
backbone: dinov2_small
lock_backbone: True
